<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a2733"/>
    </linearGradient>
    <linearGradient id="bright" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>

  <!-- shadow extrusion -->
  <path d="M 182.5 83.5 A 70 70 0 1 0 182.5 182.5"
    stroke="url(#shadow)" stroke-width="38"
    stroke-linecap="round" fill="none" opacity="0.4"/>
  <!-- mid layer -->
  <path d="M 179.5 80.5 A 70 70 0 1 0 179.5 179.5"
    stroke="url(#mid)" stroke-width="34"
    stroke-linecap="round" fill="none"/>
  <!-- front gradient -->
  <path d="M 177.5 78.5 A 70 70 0 1 0 177.5 177.5"
    stroke="url(#brand)" stroke-width="28"
    stroke-linecap="round" fill="none"/>
  <!-- highlight -->
  <path d="M 177.5 78.5 A 70 70 0 1 0 177.5 177.5"
    stroke="url(#bright)" stroke-width="3"
    stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
