<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 72" fill="none">
  <defs>
    <!-- VitePress brand: electric blue → cyan -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a2733"/>
    </linearGradient>
    <linearGradient id="bright" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <!-- signature wipe — left-to-right reveal -->
    <clipPath id="wipe">
      <rect x="0" y="0" width="0" height="72">
        <animate attributeName="width" from="0" to="230" dur="2.5s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="115" cy="36" rx="108" ry="32" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- shadow extrusion -->
  <text x="119" y="65" font-family="'Inter','Segoe UI',system-ui,sans-serif"
    font-size="80" font-weight="800" text-anchor="middle"
    fill="url(#shadow)" opacity="0.45" clip-path="url(#wipe)">Craft</text>

  <!-- mid-depth layer -->
  <text x="117" y="64" font-family="'Inter','Segoe UI',system-ui,sans-serif"
    font-size="80" font-weight="800" text-anchor="middle"
    fill="url(#mid)" clip-path="url(#wipe)">Craft</text>

  <!-- main gradient face -->
  <text x="115" y="62" font-family="'Inter','Segoe UI',system-ui,sans-serif"
    font-size="80" font-weight="800" text-anchor="middle"
    fill="url(#brand)" clip-path="url(#wipe)">Craft</text>

  <!-- bright bevel highlight -->
  <text x="115" y="62" font-family="'Inter','Segoe UI',system-ui,sans-serif"
    font-size="80" font-weight="800" text-anchor="middle"
    fill="none" stroke="url(#bright)" stroke-width="1"
    opacity="0.6" clip-path="url(#wipe)">Craft</text>

  <!-- pen tip — sweeps with the writing -->
  <rect x="0" y="12" width="6" height="50" rx="2" fill="url(#bright)" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.05;0.92;1" dur="2.5s" fill="freeze"/>
    <animate attributeName="x" from="0" to="224" dur="2.5s" fill="freeze"/>
  </rect>
</svg>
