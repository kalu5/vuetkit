<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- blue → cyan brand gradient -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- soft radial glow behind mark -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <!-- node glow -->
    <radialGradient id="nodeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <!-- gear tooth reusable shape -->
    <rect id="tooth" x="-5" y="-72" width="10" height="20" rx="3" fill="url(#brand)"/>
  </defs>

  <!-- ambient glow -->
  <circle cx="128" cy="128" r="108" fill="url(#glow)">
    <animate attributeName="r" values="100;116;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- outer rotating hex ring (dashed) — tech frame -->
  <g>
    <polygon points="128,28 215,78 215,178 128,228 41,178 41,78"
      stroke="url(#brand)" stroke-width="3" stroke-dasharray="10 8"
      stroke-linejoin="round" fill="none" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate"
        from="0 128 128" to="360 128 128" dur="28s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- gear — toolkit signal (counter-rotating) -->
  <g>
    <circle cx="128" cy="128" r="58" fill="none" stroke="url(#brand)" stroke-width="3" opacity="0.75"/>
    <use href="#tooth" transform="translate(128 128)"/>
    <use href="#tooth" transform="translate(128 128) rotate(30)"/>
    <use href="#tooth" transform="translate(128 128) rotate(60)"/>
    <use href="#tooth" transform="translate(128 128) rotate(90)"/>
    <use href="#tooth" transform="translate(128 128) rotate(120)"/>
    <use href="#tooth" transform="translate(128 128) rotate(150)"/>
    <use href="#tooth" transform="translate(128 128) rotate(180)"/>
    <use href="#tooth" transform="translate(128 128) rotate(210)"/>
    <use href="#tooth" transform="translate(128 128) rotate(240)"/>
    <use href="#tooth" transform="translate(128 128) rotate(270)"/>
    <use href="#tooth" transform="translate(128 128) rotate(300)"/>
    <use href="#tooth" transform="translate(128 128) rotate(330)"/>
    <animateTransform attributeName="transform" type="rotate"
      from="360 128 128" to="0 128 128" dur="24s" repeatCount="indefinite"/>
  </g>

  <!-- central V chevron monogram — Vue signal -->
  <path d="M88 96 L128 172 L168 96"
    stroke="url(#brand)" stroke-width="11"
    stroke-linecap="round" stroke-linejoin="round" fill="none">
    <animate attributeName="stroke-width" values="11;13;11" dur="3.5s" repeatCount="indefinite"/>
  </path>

  <!-- pulsing circuit nodes at outer hex vertices -->
  <g fill="url(#nodeGlow)">
    <circle cx="128" cy="28" r="9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="215" cy="78" r="9">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="215" cy="178" r="9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="128" cy="228" r="9">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="41" cy="178" r="9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="41" cy="78" r="9">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- bright node cores -->
  <g fill="#e0f7ff">
    <circle cx="128" cy="28" r="3.2"/>
    <circle cx="215" cy="78" r="3.2"/>
    <circle cx="215" cy="178" r="3.2"/>
    <circle cx="128" cy="228" r="3.2"/>
    <circle cx="41" cy="178" r="3.2"/>
    <circle cx="41" cy="78" r="3.2"/>
  </g>
</svg>
